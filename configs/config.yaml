# Flight Delay Prediction — project configuration
# All paths are resolved relative to the repository root by src/config.py.
# No module should hardcode paths — read them from here via load_config().

seed: 42

dataset:
  kaggle_slug: "patrickzel/flight-delay-and-cancellation-dataset-2019-2023"
  filename: "flights_sample_3m.csv"

paths:
  data_raw_dir: "data/raw"
  data_interim_dir: "data/interim"
  data_processed_dir: "data/processed"
  models_dir: "models"
  preprocessors_dir: "models/preprocessors"
  reports_dir: "reports"
  figures_dir: "reports/figures"
  metrics_dir: "reports/metrics"

  raw_csv: "data/raw/flights_sample_3m.csv"
  cancelled_diverted_monthly: "data/interim/cancelled_diverted_monthly.parquet"
  flights_nocancel: "data/interim/flights_nocancel.parquet"
  clean_parquet: "data/processed/flights_clean.parquet"
  cleaning_summary_md: "reports/cleaning_summary.md"
  eda_findings_md: "reports/eda_findings.md"

  # Phase 4: label-encoded + Z-scaled X/Y (train/test)
  x_train_label: "data/processed/X_train_label.parquet"
  x_test_label: "data/processed/X_test_label.parquet"
  y_train: "data/processed/Y_train.parquet"
  y_test: "data/processed/Y_test.parquet"
  arr_delay_y_train: "data/processed/arr_delay_only_y_train.parquet"
  arr_delay_y_test: "data/processed/arr_delay_only_y_test.parquet"

  # Phase 4: one-hot + MinMax-normalized X (train/test)
  x_train_onehot_norm: "data/processed/X_train_onehot_norm.parquet"
  x_test_onehot_norm: "data/processed/X_test_onehot_norm.parquet"

  # Phase 4: chronological (shuffle=False) sequence data for LSTM models
  x_train_lstm: "data/processed/X_train_lstm.parquet"
  x_test_lstm: "data/processed/X_test_lstm.parquet"
  y_train_lstm: "data/processed/Y_train_lstm.parquet"
  y_test_lstm: "data/processed/Y_test_lstm.parquet"

  # Phase 4: fitted encoders/scalers
  airline_encoder: "models/preprocessors/airline_encoder.joblib"
  airport_encoder: "models/preprocessors/airport_encoder.joblib"
  standard_scaler: "models/preprocessors/standard_scaler.joblib"
  minmax_scaler: "models/preprocessors/minmax_scaler.joblib"

  # Phase 5: baseline models and metrics
  xgb_baseline_model: "models/xgb_baseline.json"
  ann_baseline_model: "models/ann_baseline.keras"
  baseline_metrics_json: "reports/metrics/baseline_metrics.json"

  # Phase 6: sequence models and metrics
  lstm_model: "models/lstm_model.keras"
  hybrid_model: "models/hybrid_model.keras"
  sequence_metrics_json: "reports/metrics/sequence_metrics.json"

  # Phase 7: final comparison
  results_md: "reports/results.md"
  final_comparison_csv: "reports/metrics/final_comparison.csv"

  # Phase 8: rescheduling
  rescheduling_results_csv: "reports/rescheduling_results.csv"

split:
  test_size: 0.25

cleaning:
  iqr_multiplier: 1.5

targets:
  - DELAY_DUE_CARRIER
  - DELAY_DUE_WEATHER
  - DELAY_DUE_NAS
  - DELAY_DUE_SECURITY
  - DELAY_DUE_LATE_AIRCRAFT

# Overall arrival delay column, kept separate from the five component targets above.
arrival_delay_col: "ARR_DELAY"

features:
  # Candidate predictor columns carried forward from the original notebook analysis.
  # Phase 3/4 will trim and engineer this list; kept here as the single source of truth.
  - FL_DATE
  - AIRLINE
  - AIRLINE_CODE
  - ORIGIN
  - DEST
  - CRS_DEP_TIME
  - DEP_TIME
  - DEP_DELAY
  - CRS_ARR_TIME
  - ARR_TIME
  - CRS_ELAPSED_TIME
  - ELAPSED_TIME
  - AIR_TIME
  - DISTANCE

# Columns that mark a flight as out of scope for this project (dropped in cleaning).
exclusion_flags:
  - CANCELLED
  - DIVERTED

# ---------------------------------------------------------------------------
# Model hyperparameters — populated in later phases. Left as empty, named
# blocks now so config.py's schema does not need to change when they fill in.
# ---------------------------------------------------------------------------
models:
  xgboost:
    objective: "reg:squarederror"
  ann:
    hidden_layers: [64, 32]
    activation: "relu"
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    epochs: 50
    batch_size: 32
    validation_split: 0.2
  lstm:
    units: 64
    activation: "relu"
    recurrent_dropout: 0.2
    learning_rate: 0.001
    loss: "mse"
    metrics: ["mae"]
    epochs: 50
    batch_size: 265
    validation_split: 0.2
    early_stopping_patience: 5
  lstm_cnn_hybrid:
    conv_filters: 32
    kernel_size: 3
    conv_activation: "relu"
    pool_size: 2
    dense_cnn_units: 32
    lstm_units: 64
    lstm_activation: "relu"
    dense_lstm_units: 32
    optimizer: "adam"
    loss: "mse"
    metrics: ["mae"]
    epochs: 50
    batch_size: 512
    validation_split: 0.2
    early_stopping_patience: 5

scheduling:
  genetic:
    target_date: "2023-08-31"
    population_size: 50
    num_generations: 100
    mutation_rate: 0.1
    tournament_size: 5
    init_perturbation: 30
    mutation_perturbation: 63
    time_bounds: [0, 2359]
